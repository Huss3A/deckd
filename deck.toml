# deckd config. Written by the deckd window; hand edits are fine too (comments are lost on the next save).
brightness = 70
pages = 1
glyph_font = 'C:\Windows\Fonts\seguisym.ttf'

[[button]]
pos = "0,0"
hold_long_ms = 1000
label = "Notepad"
color = "#1f6feb"
glyph = "✎"

[button.hold]
type = "print"
text = "Held 0.5"

[button.hold_long]
type = "print"
text = "Held long"

[button.action]
type = "page"
to = "next"

[[button]]
pos = "1,0"
label = "Calc"
color = "#2ea043"
glyph = "∑"

[button.action]
type = "run"
command = "calc.exe"
args = []

[[button]]
pos = "4,0"
label = "Snip"
color = "#a371f7"
glyph = "✂"

[button.action]
type = "hotkey"
keys = "win+shift+s"

[[button]]
pos = "0,1"
label = "Vol -"
color = "#d29922"
glyph = "🔉"

[button.repeat]
type = "media"
key = "vol_down"

[button.action]
type = "media"
key = "vol_down"

[[button]]
pos = "1,1"
label = "Mute"
color = "#db6d28"
glyph = "🔇"

[button.action]
type = "media"
key = "mute"

[[button]]
pos = "2,2"
label = "Vol +"
color = "#d29922"
glyph = "🔊"

[button.repeat]
type = "media"
key = "vol_up"

[[button]]
pos = "3,1"
glyph = "✖"

[[button]]
pos = "0,2"
glyph = "⏸"

[[button]]
pos = "1,2"
glyph = "▶"

[[button]]
pos = "2,1"

[button.double]
type = "print"
text = "Double Tapped"

[button.hold]
type = "print"
text = "hELD"

[button.action]
type = "print"
text = "hello 1"
